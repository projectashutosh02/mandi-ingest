[project]
name = "mandi-ingest"
version = "0.1.0"
description = "Clean and validate Agmarknet mandi price data (data.gov.in) for analysis."
readme = "README.md"
authors = [
    { name = "Ashutosh M", email = "ashutoshmh202@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mandi-ingest = "mandi_ingest:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]